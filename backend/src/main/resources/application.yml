# ==========================================
# 1. COMMON CONFIGURATION (Always Active)
# ==========================================
spring:
  profiles:
    active: local 
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Note: 'update' is fine for now, but consider Flyway/Liquibase later!
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

application:
  security:
    jwt:
      expiration: 86400000 # 24 hours in milliseconds

ai:
  model: auto

---
# ==========================================
# 3. PRODUCTION PROFILE (Jenkins / VPS)
# ==========================================
spring:
  config:
    activate:
      on-profile: "prod"
  datasource:
    # Uses Docker network hostname 'postgres-db' as default, overrideable by Jenkins
    url: jdbc:postgresql://${DB_HOST:postgres-db}:${DB_PORT:5432}/${DB_NAME:digitalfactory}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}

ai:
  api:
    url: ${AI_API_URL:http://116.203.28.139:3002/v1/chat/completions}
    key: ${AI_API_KEY}